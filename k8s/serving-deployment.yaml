apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-serving
  namespace: ml-training
  labels:
    app: serving
    app.kubernetes.io/name: ml-ops-assignment-3
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 2
  selector:
    matchLabels:
      app: serving
      app.kubernetes.io/name: ml-ops-assignment-3
  template:
    metadata:
      labels:
        app: serving
        app.kubernetes.io/name: ml-ops-assignment-3
    spec:
      containers:
        - name: serving-container
          image: mlops-serve:v1
          volumeMounts:
            - name: checkpoints-volume
              mountPath: /app/checkpoints
              readOnly: true
          ports:
            - containerPort: 8080
              name: http-serve
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

      volumes:
        - name: checkpoints-volume
          persistentVolumeClaim:
            claimName: checkpoints-pvc
